# Banco de dados local. Os dados ficam no volume "clear_balance_pgdata".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clearbalance
      POSTGRES_PASSWORD: clearbalance_local
      POSTGRES_DB: clearbalance
    ports:
      # Só acessível a partir deste computador.
      - "127.0.0.1:5433:5432"
    volumes:
      - clear_balance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearbalance -d clearbalance"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  clear_balance_pgdata:
